[versions]
kotlin = "2.1.0"
kotlinx-serialization = "1.7.3"
zstd-jni = "1.5.7-1"
coroutines = "1.9.0"
commons-compress = "1.27.1"

[libraries]
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
zstd-jni = { module = "com.github.luben:zstd-jni", version.ref = "zstd-jni" }
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commons-compress" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlin-gradle-plugin-api = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin-api", version.ref = "kotlin" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
